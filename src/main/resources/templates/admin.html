<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><title>Administration</title>
<style>body{font-family:Arial,sans-serif;max-width:850px;margin:40px auto;padding:0 20px}table{border-collapse:collapse;width:100%}th,td{padding:12px;border:1px solid #ddd;text-align:left}th{background:#f0f4fa}button{padding:9px 16px}</style>
</head>
<body>
<h1>Administration: Users</h1>
<p>Logged in: <strong sec:authentication="name">admin</strong> | Authorities: <span sec:authentication="principal.authorities"></span></p>
<table><thead><tr><th>ID</th><th>Username</th><th>Enabled</th><th>Roles</th></tr></thead>
<tbody><tr th:each="u : ${users}"><td th:text="${u.id}"></td><td th:text="${u.username}"></td><td th:text="${u.enabled}"></td><td th:text="${u.roles}"></td></tr></tbody></table>
<p><a th:href="@{/books}">Book catalogue</a></p>
<form th:action="@{/logout}" method="post"><button type="submit">Log out</button></form>
</body></html>
