<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Catalogue</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<div class="container">

    <h1 th:text="${title}">Catalogue</h1>

    <p>Spring MVC Book Catalogue</p>

    <!-- Flash message after adding a book -->
    <div class="success-message"
         th:if="${message != null}"
         th:text="${message}">
        Book has been added
    </div>

    <!-- Add book form -->
    <h2>Add a book</h2>

    <form method="post" action="/books" class="book-form">

        <input
                type="text"
                name="title"
                placeholder="Title"
                required
        >

        <input
                type="text"
                name="author"
                placeholder="Author"
                required
        >

        <input
                type="number"
                name="year"
                placeholder="Year"
                required
        >

        <button type="submit">Add book</button>

    </form>

    <!-- Filter -->
    <h2>Books</h2>

    <form method="get" action="/books">

        <label for="author">Filter by author:</label>

        <input
                type="text"
                id="author"
                name="author"
                th:value="${author}"
                placeholder="Enter author name"
        >

        <button type="submit">Search</button>

        <a href="/books">Reset</a>

    </form>

    <br>

    <!-- Books table -->
    <table>

        <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Year</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="book : ${books}">
            <td th:text="${book.id}">1</td>
            <td th:text="${book.title}">Book title</td>
            <td th:text="${book.author}">Author</td>
            <td th:text="${book.year}">2026</td>
        </tr>

        </tbody>

    </table>

    <p th:if="${#lists.isEmpty(books)}">
        No books found.
    </p>

</div>

</body>

</html>
