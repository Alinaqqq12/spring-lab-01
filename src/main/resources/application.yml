
spring:
  application:
    name: spring-lab

  # Lab 09: PostgreSQL database
  datasource:
    url: jdbc:postgresql://localhost:5432/springlab9
    username: springlab
    password: springlab

  # Lab 09: JPA and Hibernate
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Lab 09: Database migrations
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  owner: Alina Urkenchibaeva
  group: 2406-IS
  date-pattern: "yyyy-MM-dd HH:mm:ss"

  mail:
    from: no-reply@iitu.kz
    retry-count: 3
    timeout: 5s
    enabled: true

  upload:
    max-file-size: 10MB
    allowed-extensions:
      - jpg
      - png
      - pdf

logging:
  level:
    kz.iitu: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,env,configprops,conditions
