spring:
  application:
    name: spring-lab

server:
  port: 8080

app:
  owner: Alina Urkenchibaeva
  group: 2406-IS
  date-pattern: "yyyy-MM-dd HH:mm:ss"

  mail:
    from: no-reply@iitu.kz
    retry-count: 3
    timeout: 5s
    enabled: true

  upload:
    max-file-size: 10MB
    allowed-extensions:
      - jpg
      - png
      - pdf

logging:
  level:
    kz.iitu: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,env,configprops,conditions